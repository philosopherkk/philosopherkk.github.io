<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; font-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <base href="/deid/" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>影像去識別化 · Scan De-identifier</title>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 data-i18n="title">影像去識別化</h1>
      <p class="sub" data-i18n="subtitle">Scan De-identifier</p>
      <p class="tag" data-i18n="tagline">全程在本機處理，影像不會上載。</p>
    </div>
    <button type="button" class="ghost" id="langBtn" data-i18n="lang">English</button>
  </header>

  <p class="disclaimer" role="note" data-i18n="disclaimer">
    僅為自動化輔助。分享前請自行檢查結果。本工具並非經認證的去識別化產品。
  </p>
  <p class="privacy" data-i18n="privacy">私隱：無伺服器、無分析、無第三方請求。影像只存於記憶體。</p>
  <p class="privacy" data-i18n="help">框選空白／裁切：啟用後在「裁切後」圖上拖曳。條碼／QR：本機 jsQR／ZXing 解碼（無 CDN）；偵測到的區域會標紅，請空白後再核准。OCR 資料首次使用時才下載並快取。</p>

  <section id="dropZone" class="drop" tabindex="0">
    <input type="file" id="fileInput" accept="image/*,application/pdf,.pdf,.jpg,.jpeg,.png,.heic,.heif" capture="environment" multiple hidden />
    <p data-i18n="drop">拖放 PDF／JPG／PNG，或點擊選擇／拍照</p>
  </section>

  <div id="progressWrap" class="progress hidden" aria-live="polite">
    <div class="bar"><div id="progressBar"></div></div>
    <p id="progressText" data-i18n="processing">處理中…</p>
  </div>

  <section id="workspace" class="workspace hidden">
    <div class="meta-row">
      <div>
        <span class="k" data-i18n="device">偵測裝置</span>
        <strong id="deviceLabel">—</strong>
      </div>
      <div>
        <span class="k" data-i18n="pages">頁</span>
        <select id="pageSelect"></select>
      </div>
      <label class="prefix">
        <span data-i18n="prefix">檔名前綴</span>
        <input id="prefixInput" value="DEID" maxlength="24" />
      </label>
    </div>

    <div class="tools">
      <button type="button" id="undoBtn" data-i18n="undo">復原</button>
      <button type="button" id="redoBtn" data-i18n="redo">重做</button>
      <button type="button" id="rotateBtn" data-i18n="rotate">旋轉 90°</button>
      <button type="button" id="drawBlankBtn" class="tool" data-i18n="drawBlank">框選空白</button>
      <button type="button" id="drawCropBtn" class="tool" data-i18n="drawCrop">框選裁切</button>
      <button type="button" id="blankAllBtn" data-i18n="blankAll">全部空白覆蓋</button>
      <button type="button" id="approveBtn" class="primary" data-i18n="approve">核准此頁</button>
      <button type="button" id="resetBtn" class="danger" data-i18n="reset">清除／重設</button>
    </div>

    <p id="statusMsg" class="status"></p>

    <div class="compare">
      <figure>
        <figcaption data-i18n="before">裁切前</figcaption>
        <canvas id="beforeCanvas"></canvas>
      </figure>
      <figure>
        <figcaption data-i18n="after">裁切後</figcaption>
        <div class="after-wrap">
          <canvas id="afterCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
        </div>
      </figure>
    </div>

    <div class="export-row">
      <span data-i18n="export">匯出</span>
      <button type="button" id="exportPng" data-i18n="exportPng">PNG</button>
      <button type="button" id="exportJpg" data-i18n="exportJpg">JPEG</button>
      <button type="button" id="exportPdf" data-i18n="exportPdf">PDF（純圖像）</button>
      <button type="button" id="copyBtn" data-i18n="copy">複製到剪貼簿</button>
    </div>
  </section>

  <footer class="foot">
    <a href="../">← hub</a>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
