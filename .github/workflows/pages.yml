# Manual-only Pages deploy staging.
# Does NOT run on push to main — the live site still uses "Deploy from a branch"
# until a human switches Pages source to GitHub Actions.
# If the Pages source is ever switched to GitHub Actions, `push: branches: [main]`
# must be added, or the site stops updating.
name: Deploy Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Stage site (tracked files minus ci/dev)
        run: bash scripts/stage-pages.sh
      - name: Verify stage completeness + exclusions
        run: bash scripts/verify-pages-stage.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Guard: refuse to deploy while the repo still uses legacy branch Pages.
      # Once a human switches Pages source to Actions, this check passes.
      - name: Require Pages source = GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)"
          echo "Pages build_type=$build_type"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::Pages source is still '$build_type' (branch deploy). Refusing to run deploy-pages so we cannot race or overwrite the live branch build. Switch Settings → Pages → Source to GitHub Actions, then re-run this workflow."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
