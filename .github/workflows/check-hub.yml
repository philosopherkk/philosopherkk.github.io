name: Check hub

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard root hub
        run: bash scripts/check-hub.sh
      - name: Stage Pages (exclude tests) and verify
        run: |
          bash scripts/stage-pages.sh
          bash scripts/verify-pages-stage.sh
