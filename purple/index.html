<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2d163f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Purple Sectors" />
  <title>Purple Sectors — Weekly Board</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <p style="font-family:Georgia,serif;padding:16px">Loading Purple Sectors…</p>
  <div id="root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/philosopherkk/purple-sectors@main/data-series.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/philosopherkk/purple-sectors@main/data-tracks.js"></script>
  <script>
    fetch('https://cdn.jsdelivr.net/gh/philosopherkk/purple-sectors@main/index.html')
      .then(r => r.text())
      .then(html => {
        document.open();
        document.write(html.replace('src="data-series.js"', 'src="https://cdn.jsdelivr.net/gh/philosopherkk/purple-sectors@main/data-series.js"').replace('src="data-tracks.js"', 'src="https://cdn.jsdelivr.net/gh/philosopherkk/purple-sectors@main/data-tracks.js"').replace('src="data-app.js"', 'src="https://cdn.jsdelivr.net/gh/philosopherkk/purple-sectors@main/data-app.js"'));
        document.close();
      })
      .catch(err => { document.body.textContent = 'Purple Sectors failed to load: ' + err.message; });
  </script>
</body>
</html>
