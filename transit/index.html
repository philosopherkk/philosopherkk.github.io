<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HK Transit — shortest &amp; cheapest Hong Kong routes</title>
  <meta name="description" content="Hong Kong public transport planner for MTR, bus and minibus. Live arrival times, fare breakdown, and road-following routes." />
  <meta name="theme-color" content="#071018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HK Transit" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://data.hkbus.app" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <div class="logo" aria-hidden="true">港</div>
        <div class="brand-text">
          <h1 id="t-title">HK Transit</h1>
          <p id="t-sub">MTR · Bus · Minibus · Live ETA</p>
        </div>
        <div class="brand-actions">
          <button class="pill" id="themeBtn" type="button">Light</button>
          <button class="pill" id="langBtn" type="button">中文</button>
        </div>
      </div>
      <div class="top-meta">
        <span><span class="live-dot"></span><span id="t-live">Live arrivals refresh every 20s</span></span>
        <span id="clock"></span>
      </div>
    </header>

    <main class="main-scroll" aria-label="Trip planner">
      <section class="card planner-card">
        <div class="label" id="t-from">From</div>
        <div class="row">
          <div class="grow suggest">
            <input class="field" id="originInput" autocomplete="off" placeholder="Current location or a stop" />
            <div class="suggest-list" id="originSuggest"></div>
          </div>
          <button class="icon-btn" id="geoBtn" type="button" title="Locate me" aria-label="Use my location">◎</button>
        </div>

        <div class="row swap-row">
          <button class="icon-btn" id="swapBtn" type="button" title="Swap" aria-label="Swap origin and destination">⇅</button>
        </div>

        <div class="label" id="t-to">To</div>
        <div class="suggest">
          <input class="field" id="destInput" autocomplete="off" placeholder="MTR station, estate, or landmark" />
          <div class="suggest-list" id="destSuggest"></div>
        </div>

        <div class="label examples-label" id="t-examples">Popular places</div>
        <div class="chips" id="destChips"></div>

        <button class="primary" id="planBtn" type="button">Plan shortest &amp; cheapest</button>
        <p class="empty tip" id="tipNote">Tip: tap a place chip, or type a station name.</p>
        <div class="empty" id="loadNote"></div>
        <div class="app-footer" id="appFooter"></div>
      </section>

      <div class="hero-grid" id="hero"></div>
      <div id="trips"></div>
    </main>

    <footer class="status-bar" id="status" role="status">Loading Hong Kong route catalogue…</footer>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
