<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HK Transit — shortest & cheapest Hong Kong routes</title>
  <meta name="theme-color" content="#071018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HK Transit" />
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/philosopherkk/hk-transit@main/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/philosopherkk/hk-transit@main/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">港</div>
        <div>
          <h1 id="t-title">HK Transit</h1>
          <p id="t-sub">MTR · Bus · Minibus · Live ETA</p>
        </div>
        <button class="lang" id="langBtn">中 / EN</button>
      </div>
      <div class="card">
        <div class="label" id="t-from">From</div>
        <div class="row">
          <div class="grow suggest">
            <input class="field" id="originInput" autocomplete="off" placeholder="Current location" />
            <div class="suggest-list" id="originSuggest"></div>
          </div>
          <button class="icon-btn" id="geoBtn" title="Use my location">◎</button>
        </div>
        <div class="row" style="margin-top:10px; justify-content:center">
          <button class="icon-btn" id="swapBtn" title="Swap">⇅</button>
        </div>
        <div class="label" id="t-to">To</div>
        <div class="suggest">
          <input class="field" id="destInput" autocomplete="off" placeholder="Destination in Hong Kong" />
          <div class="suggest-list" id="destSuggest"></div>
        </div>
        <div class="chips" id="destChips"></div>
        <button class="primary" id="planBtn">Plan shortest & cheapest</button>
        <div class="empty" id="loadNote"></div>
      </div>
      <div class="hero-grid" id="hero"></div>
      <div id="trips"></div>
    </aside>
    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-legend">
        <div><span class="live-dot"></span><span id="t-live">Live arrivals refresh every 20s</span></div>
        <div id="clock"></div>
      </div>
      <div class="status" id="status">Loading Hong Kong route catalogue…</div>
    </section>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (async () => {
    const base = "https://cdn.jsdelivr.net/gh/philosopherkk/hk-transit@main/";
    const files = ["c1.js", "c2.js", "c3.js", "c4.js", "c5.js"];
    const parts = await Promise.all(files.map((f) => fetch(base + f).then((r) => {
      if (!r.ok) throw new Error("Missing " + f);
      return r.text();
    })));
    const script = document.createElement("script");
    script.textContent = parts.join("");
    document.body.appendChild(script);
  })().catch((err) => {
    const el = document.getElementById("status");
    if (el) el.textContent = "Failed to load transit app: " + err.message;
  });
  </script>
</body>
</html>
