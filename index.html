<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HK Transit — shortest & cheapest Hong Kong routes</title>
  <meta name="theme-color" content="#071018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HK Transit" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="extra.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">港</div>
        <div>
          <h1 id="t-title">HK Transit</h1>
          <p id="t-sub">MTR · Bus · Minibus · Live ETA</p>
        </div>
        <button class="lang" id="langBtn">中 / EN</button>
      </div>
      <div class="card">
        <button class="geo-wide" id="geoBtn">◎ <span id="t-geo">Use my current location</span></button>
        <div class="label" id="t-from">From</div>
        <div class="suggest">
          <input class="field" id="originInput" autocomplete="off" inputmode="search" placeholder="Current location" />
          <div class="suggest-list" id="originSuggest"></div>
        </div>
        <div class="chips" id="originChips"></div>
        <div class="row" style="margin:10px 0; justify-content:center">
          <button class="icon-btn" id="swapBtn" title="Swap">⇅</button>
        </div>
        <div class="label" id="t-to">To</div>
        <div class="suggest">
          <input class="field" id="destInput" autocomplete="off" inputmode="search" placeholder="Destination in Hong Kong" />
          <div class="suggest-list" id="destSuggest"></div>
        </div>
        <div class="chips" id="destChips"></div>
        <div class="hint" id="t-hint">Tap a suggestion, a place chip, or pin A/B on the map.</div>
        <button class="primary" id="planBtn">Plan shortest & cheapest</button>
        <div class="empty" id="loadNote"></div>
        <div id="nearby"></div>
      </div>
      <div class="hero-grid" id="hero"></div>
      <div id="trips"></div>
    </aside>
    <section class="map-wrap">
      <div id="map"></div>
      <iframe id="gmap" class="gmap" title="Google Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="map-legend">
        <div class="map-tabs">
          <button class="tab on" id="tabLeaflet">Map</button>
          <button class="tab" id="tabGoogle">Google</button>
        </div>
        <div class="pin-row">
          <button class="tab" id="pinOrigin">Pin A</button>
          <button class="tab" id="pinDest">Pin B</button>
        </div>
        <a class="gopen" id="gopen" href="https://www.google.com/maps/dir/?api=1&travelmode=transit" target="_blank" rel="noopener">Open in Google Maps</a>
        <div><span class="live-dot"></span><span id="t-live">Live arrivals refresh every 20s</span></div>
        <div id="clock"></div>
      </div>
      <div class="status" id="status">Loading Hong Kong route catalogue…</div>
    </section>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="app-loader.js"></script>
  <script>
  (function () {
    var g = document.getElementById("gmap");
    var a = document.getElementById("gopen");
    function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener("click", fn); }
    on("tabGoogle", function () {
      g.classList.add("on");
      document.getElementById("tabGoogle").classList.add("on");
      document.getElementById("tabLeaflet").classList.remove("on");
      var o = document.getElementById("originInput").value;
      var d = document.getElementById("destInput").value;
      var q = (o && d) ? (o + " to " + d + " Hong Kong") : ((d || o || "Hong Kong") + " Hong Kong");
      g.src = "https://maps.google.com/maps?q=" + encodeURIComponent(q) + "&hl=en&z=14&output=embed";
      a.href = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(o || "My location") + "&destination=" + encodeURIComponent(d || "Hong Kong") + "&travelmode=transit";
    });
    on("tabLeaflet", function () {
      g.classList.remove("on");
      document.getElementById("tabLeaflet").classList.add("on");
      document.getElementById("tabGoogle").classList.remove("on");
    });
    on("gopen", function () {
      var o = document.getElementById("originInput").value;
      var d = document.getElementById("destInput").value;
      this.href = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(o || "My location") + "&destination=" + encodeURIComponent((d || "Central") + ", Hong Kong") + "&travelmode=transit";
    });
  })();
  </script>
</body>
</html>
