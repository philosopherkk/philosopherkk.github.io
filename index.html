<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>philosopherkk</title>
  <meta name="description" content="philosopherkk — personal site." />
  <meta name="theme-color" content="#0e1116" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#0e1116; --text:#e8edf5; --muted:#8b97a8; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      padding: 28px 18px;
    }
    main { text-align: center; max-width: 28rem; }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    p { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1>philosopherkk</h1>
    <p>Personal site.</p>

</html>
